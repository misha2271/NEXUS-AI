[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-desktop"
version = "1.0.0"
description = "Local Ollama chat and real hardware telemetry for Windows 11."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<6.12",
    "psutil>=5.9,<8",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12,<14"]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1", "build>=1.2,<2"]
freeze = ["pyinstaller>=6.11,<7"]
security = ["bandit>=1.8,<2", "pip-audit>=2.9,<3"]

[project.gui-scripts]
nexus-ai = "nexus_ai.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
