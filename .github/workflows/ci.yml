name: CI

on:
  push:
    branches: [main, feature/nexus-ai-v1.0]
  pull_request:
    branches: [main, feature/nexus-ai-v0.4-dashboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libgl1
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,nvidia]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Compile modules
        run: python -m compileall -q src
      - name: Build wheel and source distribution
        run: python -m build

  security:
    name: Security / source and installed dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and security dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[nvidia,security]"
      - name: Scan source for medium and high severity issues
        run: python -m bandit -r src -ll -ii -f json -o bandit-report.json
      - name: Audit installed dependency versions
        if: success() || failure()
        run: python -m pip_audit --progress-spinner off --format json -o dependency-audit.json
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-1.0.0-security-reports
          path: |
            bandit-report.json
            dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
